version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/src/GitHubProfileAnalytics"
      - "/src/Tests/GitHubProfileAnalytics.Tests"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # ASP.NET Core 10 requires Microsoft.OpenApi < 3.0.0
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
    groups:
      efcore:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore.*"
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
      xunit:
        patterns:
          - "xunit*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
